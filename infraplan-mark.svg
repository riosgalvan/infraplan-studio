<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">InfraPlan Studio</title>
  <desc id="desc">Una N construida como una ruta técnica con tres nodos conectados.</desc>
  <defs>
    <linearGradient id="infraplan-gradient" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b6bdc"/>
      <stop offset="1" stop-color="#27c6df"/>
    </linearGradient>
    <filter id="infraplan-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#00142d" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#infraplan-gradient)" filter="url(#infraplan-shadow)"/>
  <path d="M27 72V29L73 71V28" fill="none" stroke="#eff8ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#27c6df" stroke="#eff8ff" stroke-width="3">
    <circle cx="27" cy="72" r="6"/>
    <circle cx="50" cy="50" r="6"/>
    <circle cx="73" cy="28" r="6"/>
  </g>
</svg>
